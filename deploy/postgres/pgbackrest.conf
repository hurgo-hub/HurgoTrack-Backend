# Configuración de pgBackRest sin secretos. El bucket, el endpoint, las llaves y
# la clave de cifrado llegan por variables PGBACKREST_* desde .env.backup
# (lo crea deploy/backup/configure-backup.sh en el VPS).
[global]
repo1-type=s3
repo1-path=/pgbackrest
repo1-cipher-type=aes-256-cbc
# 5 completos semanales (~5 semanas). El Object Lock del bucket debe durar menos
# (ej. 30 días), o expire no puede borrar los respaldos viejos.
repo1-retention-full-type=count
repo1-retention-full=5
compress-type=zst
process-max=2
start-fast=y
archive-async=y
spool-path=/var/spool/pgbackrest
log-level-console=info
log-level-file=detail

[hurgotrack]
pg1-path=/var/lib/postgresql/data
pg1-user=hurgotrack
